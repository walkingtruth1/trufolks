name: Offline AI team tests
on:
  pull_request:
    paths:
      - 'team/**'
      - '.github/workflows/agent-team-tests.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s team/tests -v
